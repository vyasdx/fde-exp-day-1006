properties:
  template:
    containers:
      - name: bank
        image: ${IMAGE}
        resources:
          cpu: 0.5
          memory: 1Gi
        ports:
          - port: 8080
            protocol: TCP
        env:
          - name: ASPNETCORE_URLS
            value: "http://+:8080"
          - name: FDE_PARTICIPANT_ID
            value: "${FDE_PARTICIPANT_ID}"
          - name: FDE_NUMERIC_ID
            value: "${FDE_NUMERIC_ID}"
          - name: FDE_POD_ID
            value: "${FDE_POD_ID}"
          - name: FDE_EVENT_ID
            value: "${FDE_EVENT_ID}"
          - name: FDE_WORKLOAD_TYPE
            value: "${FDE_WORKLOAD_TYPE}"
          # Wire approval threshold, in DOLLARS. Literal, not ${...}: cd.yml is
          # never edited by participants and does not export this, so a
          # placeholder would envsubst to empty and silently fall back to the
          # shipped default. MUST equal settings.wire_transfer_threshold in
          # governance/policy.yaml — the app reads this, the eval reads that.
          - name: FDE_WIRE_TRANSFER_THRESHOLD
            value: "500.00"
          - name: FDE_AGENT_GATEWAY_ENDPOINT
            value: "${FDE_AGENT_GATEWAY_ENDPOINT}"
          - name: FDE_AGENT_GATEWAY_KEY
            value: "${FDE_AGENT_GATEWAY_KEY}"
          - name: FDE_LANGFUSE_OTLP_ENDPOINT
            value: "${FDE_LANGFUSE_OTLP_ENDPOINT}"
          - name: FDE_LANGFUSE_OTLP_HEADERS
            value: "${FDE_LANGFUSE_OTLP_HEADERS}"
    scale:
      minReplicas: 1
      maxReplicas: 2
  configuration:
    ingress:
      external: true
      targetPort: 8080
      transport: http